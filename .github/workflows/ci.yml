name: CI Pipeline

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------
  # Job 1: Architecture, DI, and Anti-Spaghetti Health Check
  # -------------------------------------------------------------
  architecture-health:
    name: Architecture & Code Health
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Architecture & DI & Code Smell Audits
        run: python3 .github/scripts/check-code-health.py

  # -------------------------------------------------------------
  # Job 2: Build, Unit Tests & Multiplatform Verification
  # -------------------------------------------------------------
  build-and-test:
    name: Build & Unit Tests
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Run KMP Unit Tests
        run: ./gradlew :shared:allTests --no-daemon --stacktrace

      - name: Assemble Android App (Debug)
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

  # -------------------------------------------------------------
  # Job 3: Documentation Validation
  # -------------------------------------------------------------
  docs-validation:
    name: Documentation Validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.x
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install MkDocs Material
        run: pip install mkdocs-material==9.5.18

      - name: Strict MkDocs Build
        run: mkdocs build --strict
